# ============================================================
# Nginx para TCV LogiSuite: HTTPS con redirección automática desde HTTP.
# Se instala como /etc/nginx/sites-available/tcvls (ver docs/operacion/SERVIDOR.md).
#
#   http://tcvlogisuite.com, http://www… y https://www…  →  https://tcvlogisuite.com
#   https://tcvlogisuite.com  →  la app (contenedor Docker en 127.0.0.1:3001)
#
# El certificado lo emite y renueva Certbot (Let's Encrypt). Debe cubrir
# tcvlogisuite.com y www.tcvlogisuite.com.
# ============================================================

upstream tcvls_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

# HTTP: todo a HTTPS, salvo la validación de Let's Encrypt para renovar.
server {
    listen 80;
    listen [::]:80;
    server_name tcvlogisuite.com www.tcvlogisuite.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://tcvlogisuite.com$request_uri;
    }
}

# www con HTTPS → dominio principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tcvlogisuite.com;

    ssl_certificate     /etc/letsencrypt/live/tcvlogisuite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcvlogisuite.com/privkey.pem;
    include /etc/nginx/snippets/tcvls-ssl.conf;

    return 301 https://tcvlogisuite.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tcvlogisuite.com;

    ssl_certificate     /etc/letsencrypt/live/tcvlogisuite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcvlogisuite.com/privkey.pem;
    include /etc/nginx/snippets/tcvls-ssl.conf;

    # No anunciar la versión de Nginx
    server_tokens off;

    # La app limita el JSON a 100 KB; esto cubre la carga de certificados.
    client_max_body_size 2M;

    location / {
        proxy_pass http://tcvls_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # La app usa este encabezado para saber que la conexión es HTTPS
        # (activa HSTS y las cookies/cabeceras seguras).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
