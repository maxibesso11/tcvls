# ============================================================
# Configuración de Nginx como reverse proxy para el ERP.
# Copiar a /etc/nginx/sites-available/erp y enlazar a sites-enabled.
# Reemplazar "erp.midominio.com" por tu dominio real.
# ============================================================

server {
    listen 80;
    server_name erp.midominio.com;

    # Tamaño máximo de subida (ajustar si se suben archivos grandes)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

