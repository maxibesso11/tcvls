<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
<title>TCV LogiSuite Rediseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: rail oscuro (tema del usuario) + barra superior + vista de trabajo sobre papel. Tokens del sistema de diseño TCV LogiSuite. Un solo aspecto claro, a propósito: el producto no tiene modo oscuro. */
:root{color-scheme:light;--paper:#f3f4f1;--surface:#ffffff;--surface-sunk:#e8eae5;--line:#d6d9d2;--line-strong:#7f877f;--ink:#0f1b2d;--ink-2:#465163;--ink-3:#5b6676;--brand-navy:#16386b;--brand-cyan:#38b6ff;--rail:#16386b;--rail-raised:#1c4789;--rail-ink:#f4f6f8;--rail-ink-muted:#adbacf;--accent:#38b6ff;--on-accent:#0f1b2d;--accent-text:#006cab;--focus:#0f1b2d;--ok:#1c6a37;--ok-tint:#e1efe4;--warn:#7a4e00;--warn-tint:#fbecc6;--warn-fill:#f2a900;--danger:#b0251b;--danger-tint:#fbe2de;--danger-fill:#c8321f;--info:#0a5c93;--info-tint:#dcedf9;--plate-band:#1d4f9c;--plate-ink:#111418;--plate-bg:#ffffff;--chart-income:#16386b;--chart-cost:#d2691e;--chart-alt:#38b6ff;--chart-muted:#a3abb5;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--radius-s:2px;--radius-m:4px;--radius-l:8px;--shadow-pop:0 8px 24px rgba(15,27,45,0.18), 0 1px 2px rgba(15,27,45,0.12);--font-display:"Barlow Condensed", "Arial Narrow", sans-serif;--font-text:"Archivo", system-ui, sans-serif;--font-mono:"IBM Plex Mono", ui-monospace, monospace;}
[data-tema="tcv"]{--rail:#16386b;--rail-raised:#1c4789;--accent:#38b6ff;--accent-text:#006cab;--on-accent:#0f1b2d;--rail-ink-muted:#adbacf;}
[data-tema="verde"]{--rail:#1d2f29;--rail-raised:#2b453c;--accent:#e8a13c;--accent-text:#915c11;--on-accent:#0f1b2d;--rail-ink-muted:#a0b0ab;}
[data-tema="azul"]{--rail:#1a2940;--rail-raised:#243959;--accent:#4f9dde;--accent-text:#206baa;--on-accent:#0f1b2d;--rail-ink-muted:#98a4b6;}
[data-tema="violeta"]{--rail:#2f2046;--rail-raised:#3f2b5e;--accent:#a779e0;--accent-text:#8443d4;--on-accent:#0f1b2d;--rail-ink-muted:#a69bb5;}
[data-tema="borgona"]{--rail:#3c1d22;--rail-raised:#542930;--accent:#d98f6b;--accent-text:#a2512a;--on-accent:#0f1b2d;--rail-ink-muted:#b39b9e;}
[data-tema="grafito"]{--rail:#292a2d;--rail-raised:#3a3b40;--accent:#d6a85c;--accent-text:#866122;--on-accent:#0f1b2d;--rail-ink-muted:#a7a7aa;}
[data-tema="oceano"]{--rail:#163b3f;--rail-raised:#1f5459;--accent:#3bb3a8;--accent-text:#26726b;--on-accent:#0f1b2d;--rail-ink-muted:#abc4c6;}
[data-tema="indigo"]{--rail:#25264f;--rail-raised:#303267;--accent:#7c83f8;--accent-text:#4751f5;--on-accent:#0f1b2d;--rail-ink-muted:#a0a0b8;}
[data-tema="esmeralda"]{--rail:#133d2e;--rail-raised:#1b5843;--accent:#2ecc8f;--accent-text:#1a7552;--on-accent:#0f1b2d;--rail-ink-muted:#aac7bd;}
[data-tema="cobre"]{--rail:#3d271b;--rail-raised:#563726;--accent:#e08a4b;--accent-text:#9f531b;--on-accent:#0f1b2d;--rail-ink-muted:#b9a8a0;}
[data-tema="rosa"]{--rail:#421d33;--rail-raised:#5b2846;--accent:#e06b9e;--accent-text:#bf286a;--on-accent:#0f1b2d;--rail-ink-muted:#b89dae;}
[data-tema="slate"]{--rail:#21282f;--rail-raised:#303a44;--accent:#6aa0c8;--accent-text:#366c93;--on-accent:#0f1b2d;--rail-ink-muted:#9ea4ab;}
[data-tema="bosque"]{--rail:#1f3324;--rail-raised:#2c4934;--accent:#9bc24a;--accent-text:#576f25;--on-accent:#0f1b2d;--rail-ink-muted:#a5b5aa;}


/* =====================================================================
   TCV LogiSuite — componentes (CSS puro, sin framework)
   Lee las variables de tokens.css. Nombres en castellano, como el código.
   ===================================================================== */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14px/20px var(--font-text); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.rotulo { font: 600 11px/14px var(--font-text); letter-spacing: .9px; text-transform: uppercase; color: var(--ink-2); }
.tenue { color: var(--ink-3); }

/* ---------- Botón ---------- */
.btn { display: inline-flex; align-items: center; gap: var(--space-2); height: 34px; padding: 0 var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-m); background: var(--surface); color: var(--ink); font: 600 13.5px/1 var(--font-text); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-sunk); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-primario { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primario:hover { background: var(--accent); filter: brightness(.94); }
.btn-tinta { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn-tinta:hover { background: var(--ink); filter: brightness(1.25); }
.btn-fantasma { border-color: transparent; background: transparent; }
.btn-peligro { background: var(--danger-fill); border-color: var(--danger-fill); color: #fff; }
.btn-peligro:hover { background: var(--danger-fill); filter: brightness(.92); }
.btn-chico { height: 28px; padding: 0 var(--space-2); font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Patente (Mercosur) ---------- */
.patente { display: inline-flex; flex-direction: column; align-items: stretch; min-width: 88px; border: 1.5px solid var(--plate-ink); border-radius: var(--radius-s); background: var(--plate-bg); overflow: hidden; vertical-align: middle; line-height: 1; }
.patente::before { content: ""; display: block; height: 5px; background: var(--plate-band); }
.patente b { display: block; padding: 3px 7px 4px; font: 600 17px/18px var(--font-display); letter-spacing: 1.6px; color: var(--plate-ink); text-align: center; white-space: nowrap; }
.patente-chica { min-width: 66px; }
.patente-chica::before { height: 3px; }
.patente-chica b { padding: 2px 5px 3px; font-size: 13.5px; line-height: 14px; letter-spacing: 1.1px; }
.patente-grande { min-width: 150px; border-width: 2px; }
.patente-grande::before { height: 9px; }
.patente-grande b { padding: 5px 12px 7px; font-size: 32px; line-height: 32px; letter-spacing: 3px; }
a .patente, .patente[href] { cursor: pointer; }

/* ---------- Insignia (estado) ---------- */
.insignia { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border-radius: var(--radius-s); background: var(--surface-sunk); color: var(--ink); font: 600 11px/1 var(--font-text); letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
.insignia::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.insignia.sin-punto::before { display: none; }
.insignia.ok { background: var(--ok-tint); color: var(--ok); }
.insignia.aviso { background: var(--warn-tint); color: var(--warn); }
.insignia.peligro { background: var(--danger-tint); color: var(--danger); }
.insignia.info { background: var(--info-tint); color: var(--info); }
.insignia.marca { background: var(--brand-navy); color: #fff; }

/* ---------- Cifra (KPI) ---------- */
.cifra { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cifra-valor { font: 600 36px/36px var(--font-display); color: var(--ink); white-space: nowrap; }
.cifra-valor small { font: 500 18px/1 var(--font-display); color: var(--ink-3); margin-left: 3px; }
.cifra-xl .cifra-valor { font-size: 56px; line-height: 52px; letter-spacing: -.5px; }
.cifra-delta { display: inline-flex; align-items: center; gap: 4px; font: 600 12.5px/16px var(--font-text); }
.cifra-delta.sube { color: var(--ok); } .cifra-delta.baja { color: var(--danger); }
.cifra-delta .tenue { font-weight: 400; }
.cifra-traza { display: block; width: 100%; height: 28px; }
.cifra-traza path { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.cifra-traza circle { fill: var(--ink); }

/* Franja de pulso: cifras en fila separadas por reglas verticales */
.pulso { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); }
.pulso > .cifra { padding: var(--space-4) var(--space-5); border-left: 1px solid var(--line); }
.pulso > .cifra:first-child { border-left: 0; }

/* ---------- Hoja (panel) ---------- */
.hoja { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); min-width: 0; }
.hoja-cabecera { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
.hoja-titulo { margin: 0; font: 600 20px/22px var(--font-display); letter-spacing: .3px; }
.hoja-sub { font-size: 12.5px; color: var(--ink-3); }
.hoja-cuerpo { padding: var(--space-4); }
.hoja-pie { padding: var(--space-2) var(--space-4); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.hoja-pie a, .link { color: var(--accent-text); font-weight: 600; text-decoration: none; }
.hoja-pie a:hover, .link:hover { text-decoration: underline; }

/* ---------- Tabla densa ---------- */
.tabla-marco { overflow-x: auto; }
.tabla { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabla th { position: sticky; top: 0; z-index: 1; padding: 8px var(--space-3); background: var(--surface-sunk); border-bottom: 1px solid var(--line); text-align: left; font: 600 11px/14px var(--font-text); letter-spacing: .9px; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.tabla th.num { text-align: right; }
.tabla td { padding: 9px var(--space-3); border-bottom: 1px solid var(--line); vertical-align: middle; }
.tabla tbody tr:hover td { background: #f7f8f5; }
.tabla tbody tr.clic { cursor: pointer; }
.tabla tr.sel td { background: var(--surface-sunk); }
.tabla td.fuerte { font-weight: 600; }
.tabla tfoot td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; }

/* Barra inline (dentro de celdas) */
.barra { position: relative; height: 8px; min-width: 80px; background: var(--surface-sunk); border-radius: var(--radius-s); overflow: hidden; }
.barra > i { position: absolute; inset: 0 auto 0 0; background: var(--chart-income); border-radius: var(--radius-s); }
.barra.costo > i { background: var(--chart-cost); }
.barra-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; align-items: center; }
.barra-doble .izq { direction: rtl; }
.barra-doble .izq > i { inset: 0 0 0 auto; background: var(--chart-cost); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 10px var(--space-3) 11px; border: 0; background: none; color: var(--ink-2); font: 600 13.5px/1 var(--font-text); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: var(--space-3); right: var(--space-3); bottom: -1px; height: 3px; background: var(--accent-text); }
.tab .cuenta { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--surface-sunk); color: var(--ink-2); font-size: 11px; line-height: 18px; text-align: center; }
.tab .cuenta.peligro { background: var(--danger-fill); color: #fff; }

/* Segmentado (períodos, filtros rápidos) */
.segmentado { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-m); overflow: hidden; }
.segmentado button { height: 30px; padding: 0 var(--space-3); border: 0; border-left: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: 600 12.5px/1 var(--font-text); cursor: pointer; }
.segmentado button:first-child { border-left: 0; }
.segmentado button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* ---------- Campo ---------- */
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo label { font: 600 12.5px/16px var(--font-text); color: var(--ink-2); }
.campo input, .campo select, .campo textarea, .entrada { height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-m); background: var(--surface); color: var(--ink); font: 400 14px/20px var(--font-text); width: 100%; }
.campo textarea { height: auto; min-height: 72px; padding: 8px 10px; }
.campo input::placeholder, .entrada::placeholder { color: var(--ink-3); }
.campo .ayuda { font-size: 12.5px; color: var(--ink-3); }
.campo.error input, .campo.error select { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.campo.error .ayuda { color: var(--danger); }
.formulario { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3) var(--space-4); }
.formulario .ancho { grid-column: 1 / -1; }
.formulario fieldset { grid-column: 1 / -1; margin: var(--space-2) 0 0; padding: var(--space-3) 0 0; border: 0; border-top: 1px solid var(--line); display: contents; }
.grupo-titulo { grid-column: 1 / -1; margin-top: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--line); }

/* ---------- Alerta (fila con cuenta regresiva) ---------- */
.alertas { list-style: none; margin: 0; padding: 0; }
.alerta { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: var(--space-3); padding: 8px var(--space-4); border-bottom: 1px solid var(--line); }
.alerta:last-child { border-bottom: 0; }
.alerta-dias { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 40px; border-radius: var(--radius-s); background: var(--surface-sunk); color: var(--ink); font: 600 20px/1 var(--font-display); }
.alerta-dias small { font: 600 9.5px/1 var(--font-text); letter-spacing: .6px; text-transform: uppercase; margin-top: 2px; }
.alerta.vencida .alerta-dias { background: var(--danger-fill); color: #fff; }
.alerta.pronto .alerta-dias { background: var(--warn-fill); color: var(--ink); }
.alerta-texto { min-width: 0; }
.alerta-texto strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alerta-texto span { font-size: 12.5px; color: var(--ink-3); }

/* ---------- Composición del equipo (tractor + acoplado + chofer) ---------- */
.composicion { display: flex; align-items: flex-end; gap: 0; }
.comp-pieza { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.comp-silueta { display: block; height: 46px; }
.comp-silueta .caja { fill: var(--surface-sunk); stroke: var(--ink); stroke-width: 1.5; }
.comp-silueta .cabina { fill: var(--brand-navy); }
.comp-silueta .rueda { fill: var(--ink); }
.comp-silueta .llanta { fill: var(--surface); }
.comp-pieza.actual .comp-silueta .caja { fill: var(--info-tint); }
.comp-enganche { width: 14px; height: 3px; margin-bottom: 38px; background: var(--ink); }
.comp-chofer { margin-left: var(--space-5); padding-left: var(--space-4); border-left: 1px solid var(--line); align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 2px; }

/* ---------- Rail (navegación lateral) ---------- */
.rail { display: flex; flex-direction: column; width: 232px; min-height: 100%; background: var(--rail); color: var(--rail-ink); }
.rail-marca { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; }
.rail-marca img { width: 32px; height: 32px; }
.rail-marca b { display: block; font: 600 17px/18px var(--font-display); letter-spacing: .4px; }
.rail-marca span { font-size: 11.5px; color: var(--rail-ink-muted); }
.rail-grupo { padding: 14px 16px 6px; font: 600 10.5px/14px var(--font-text); letter-spacing: 1.1px; text-transform: uppercase; color: var(--rail-ink-muted); }
.rail a { position: relative; display: flex; align-items: center; gap: 10px; margin: 1px 8px; padding: 7px 10px; border-radius: var(--radius-m); color: var(--rail-ink); font: 500 13.5px/18px var(--font-text); text-decoration: none; }
.rail a svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.rail a:hover { background: var(--rail-raised); }
.rail a[aria-current="page"] { background: var(--rail-raised); font-weight: 600; }
.rail a[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.rail a .cuenta { margin-left: auto; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font: 700 11px/18px var(--font-text); text-align: center; }
.rail :focus-visible { outline-color: var(--accent); }

/* ---------- Ficha (cabecera de detalle) ---------- */
.ficha-cabecera { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4) var(--space-5); padding: var(--space-5); background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--radius-m) var(--radius-m) 0 0; }
.ficha-datos { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); }
.ficha-dato { display: flex; flex-direction: column; gap: 2px; }
.ficha-dato b { font-weight: 600; }
.ficha-tabs { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius-m) var(--radius-m); padding: 0 var(--space-3); }

/* ---------- Modal ---------- */
.modal { width: min(640px, 100%); background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--shadow-pop); overflow: hidden; }
.modal-cabecera { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--line); }
.modal-cabecera h2 { margin: 0; font: 600 22px/24px var(--font-display); }
.modal-cuerpo { padding: var(--space-5); max-height: 70vh; overflow: auto; }
.modal-pie { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-5); background: var(--paper); border-top: 1px solid var(--line); }

/* ---------- Vacío ---------- */
.vacio { padding: var(--space-6) var(--space-4); text-align: center; color: var(--ink-3); }

@media (max-width: 640px) {
  .formulario { grid-template-columns: 1fr; }
  .pulso > .cifra { border-left: 0; border-top: 1px solid var(--line); }
  .pulso > .cifra:first-child { border-top: 0; }
  .cifra-xl .cifra-valor { font-size: 44px; line-height: 44px; }
}

/* Layout: rail oscuro fijo a la izquierda + barra superior + vista de trabajo sobre papel. */
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.app > .rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.rail-pie { margin-top: auto; padding: 12px 16px 16px; border-top: 1px solid var(--rail-raised); display: flex; flex-direction: column; gap: 8px; }
.rail-pie label { font: 600 10.5px/14px var(--font-text); letter-spacing: 1.1px; text-transform: uppercase; color: var(--rail-ink-muted); }
.rail-pie select { height: 30px; background: var(--rail-raised); color: var(--rail-ink); border: 1px solid var(--rail-ink-muted); border-radius: var(--radius-m); padding: 0 6px; font: 500 13px var(--font-text); }
.rail-marca button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.rail-marca svg { width: 32px; height: 32px; flex: none; }

.principal { min-width: 0; display: flex; flex-direction: column; }
.barra-sup { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.barra-sup .buscar { position: relative; flex: 1; max-width: 420px; }
.barra-sup .buscar svg { position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; color: var(--ink-3); }
.barra-sup .buscar input { padding-left: 34px; height: 34px; background: var(--paper); }
.barra-sup .espacio { flex: 1; }
.btn-menu { display: none; }
.campana { position: relative; }
.campana .punto { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--danger-fill); color: #fff; font: 700 10.5px/18px var(--font-text); text-align: center; }
.usuario { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }

// ===== Cálculos =====
function resultadosEquipos() {
  const f = P().f;
  return EQUIPOS.map(e => {
    const r = RESULTADOS[e.id];
    const ingresos = r.ingresos * f, costos = (r.combustible + r.consumos + r.sueldo) * f;
    return { e, ingresos, combustible: r.combustible * f, consumos: r.consumos * f, sueldo: r.sueldo * f, costos, resultado: ingresos - costos, kml: r.km / r.litros, costoKm: (r.combustible + r.consumos + r.sueldo) / r.km, km: r.km * f };
  }).sort((a, b) => b.resultado - a.resultado);
}
function totales() {
  const rs = resultadosEquipos(), f = P().f;
  const t = rs.reduce((a, r) => ({ ingresos: a.ingresos + r.ingresos, combustible: a.combustible + r.combustible, consumos: a.consumos + r.consumos, sueldo: a.sueldo + r.sueldo, km: a.km + r.km }), { ingresos: 0, combustible: 0, consumos: 0, sueldo: 0, km: 0 });
  t.admin = ADMIN_MES * f; t.sinEquipo = SIN_EQUIPO_MES * f;
  t.costos = t.combustible + t.consumos + t.sueldo + t.admin + t.sinEquipo;
  t.neto = t.ingresos - t.costos; t.margen = t.neto / t.ingresos * 100;
  const litros = Object.values(RESULTADOS).reduce((a, r) => a + r.litros, 0), km = Object.values(RESULTADOS).reduce((a, r) => a + r.km, 0);
  t.kml = km / litros;
  t.porCobrar = CLIENTES.filter(c => c.saldo > 0).reduce((a, c) => a + c.saldo, 0);
  t.vencido = CLIENTES.reduce((a, c) => a + c.tramos[2] + c.tramos[3], 0);
  return t;
}

// ===== Gráficos =====
function traza(serie, w = 120, h = 28) {
  const mn = Math.min(...serie), mx = Math.max(...serie), dx = w / (serie.length - 1);
  const y = v => h - 3 - (v - mn) / ((mx - mn) || 1) * (h - 6);
  const d = serie.map((v, i) => `${i ? 'L' : 'M'}${(i * dx).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg class="cifra-traza" viewBox="-3 0 ${w + 6} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" vector-effect="non-scaling-stroke"/><circle cx="${w}" cy="${y(serie.at(-1)).toFixed(1)}" r="2.5"/></svg>`;
}
function cifra(rotulo, valor, delta, bueno, comp, serie, xl) {
  const d = delta == null ? '' : `<span class="cifra-delta ${bueno ? 'sube' : 'baja'}">${delta} <span class="tenue">${comp || P().ant}</span></span>`;
  return `<div class="cifra ${xl ? 'cifra-xl' : ''}"><span class="rotulo">${rotulo}</span><span class="cifra-valor">${valor}</span>${d}${serie ? traza(serie) : ''}</div>`;
}
function cascada(t) {
  const pasos = [['Ingresos', t.ingresos, 'in'], ['Combustible', -t.combustible], ['Consumos', -t.consumos], ['Sueldos', -t.sueldo], ['Administración', -t.admin], ['Sin equipo', -t.sinEquipo], ['Resultado', t.neto, 'tot']];
  const W = 720, H = 250, top = 28, bot = 46, padL = 8, n = pasos.length, bw = (W - padL * 2) / n;
  const sc = v => (H - bot) - v / t.ingresos * (H - top - bot);
  let acc = 0, out = '';
  [0.25, .5, .75, 1].forEach(g => { out += `<line class="eje" x1="0" x2="${W}" y1="${sc(t.ingresos * g)}" y2="${sc(t.ingresos * g)}"/>`; });
  pasos.forEach(([nom, v, tipo], i) => {
    let y0, y1, fill;
    if (tipo === 'in') { y0 = 0; y1 = v; acc = v; fill = 'var(--chart-income)'; }
    else if (tipo === 'tot') { y0 = 0; y1 = v; fill = v >= 0 ? 'var(--ok)' : 'var(--danger-fill)'; }
    else { y0 = acc + v; y1 = acc; acc += v; fill = 'var(--chart-cost)'; }
    const x = padL + i * bw + bw * 0.16, w = bw * 0.68, yt = sc(Math.max(y0, y1)), yb = sc(Math.min(y0, y1));
    out += `<rect x="${x}" y="${yt}" width="${w}" height="${Math.max(1.5, yb - yt)}" fill="${fill}" rx="2"/>`;
    if (i < n - 1 && tipo !== 'tot') out += `<line x1="${x + w}" x2="${x + bw}" y1="${sc(acc)}" y2="${sc(acc)}" stroke="var(--ink-3)" stroke-dasharray="3 3"/>`;
    out += `<text class="valor" x="${x + w / 2}" y="${yt - 7}" text-anchor="middle">${tipo ? millones(v) : '−' + millones(-v).slice(2)}</text>`;
    out += `<text x="${x + w / 2}" y="${H - bot + 18}" text-anchor="middle">${nom}</text>`;
    if (!tipo) out += `<text x="${x + w / 2}" y="${H - bot + 33}" text-anchor="middle" style="fill:var(--ink-3)">${num(-v / t.ingresos * 100, 0)}%</text>`;
  });
  out += `<line class="base" x1="0" x2="${W}" y1="${sc(0)}" y2="${sc(0)}"/>`;
  return `<div class="tabla-marco"><svg class="grafico" viewBox="0 0 ${W} ${H}" style="min-width:560px" role="img" aria-label="Cascada del resultado">${out}</svg></div>`;
}
function columnasMeses(ing, cos, alto = 200) {
  const W = 1100, H = alto, top = 16, bot = 26, mx = Math.max(...ing, ...cos) * 1.1, n = ing.length, gw = W / n;
  const sc = v => (H - bot) - v / mx * (H - top - bot);
  let out = '';
  [.33, .66, 1].forEach(g => out += `<line class="eje" x1="0" x2="${W}" y1="${sc(mx * g / 1.1)}" y2="${sc(mx * g / 1.1)}"/>`);
  ing.forEach((v, i) => {

    </div>
    ${hoja('Usuarios', '', tabla([{ t: 'Usuario' }, { t: 'Rol' }, { t: 'Estado' }], [['mbesso', 'ADMIN_EMPRESA'], ['oficina', 'OPERADOR'], ['chofer01', 'OPERADOR']].map(u => ({ c: [`<span class="mono">${u[0]}</span>`, `<span class="insignia sin-punto">${u[1]}</span>`, '<span class="insignia ok">Activo</span>'] }))))}`;

// ===== Rail y render =====
const NAV_OP = [['Operación', [['tablero', 'Tablero'], ['viajes', 'Viajes', () => VIAJES.filter(v => v.estado === 'EN CURSO' || v.estado === 'EN DESTINO').length], ['equipos', 'Equipos']]],
  ['Flota', [['unidades', 'Unidades'], ['choferes', 'Choferes'], ['agenda', 'Agenda', () => ALERTAS.filter(a => a.tipo !== 'cobro').length]]],
  ['Costos', [['gastos', 'Gastos'], ['stock', 'Stock']]],
  ['Finanzas', [['facturacion', 'Facturación'], ['cuentas', 'Cuentas']]],
  ['Empresa', [['config', 'Configuración']]]];
const NAV_ADMIN = [['Plataforma', [['panorama', 'Panorama'], ['empresas', 'Empresas'], ['usuarios', 'Usuarios']]]];
const ISO = '<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="6" y="6" width="108" height="108" rx="24" fill="#16386b"/><path d="M28 86 Q49 86 62 68 T96 42" fill="none" stroke="#38b6ff" stroke-width="7" stroke-linecap="round"/><circle cx="28" cy="86" r="6" fill="#f7fafd"/><path d="M89 33 L103 42 L89 51 Z" fill="#38b6ff"/></svg>';
function rail() {

    ${nav.map(([g, items]) => `<div class="rail-grupo">${g}</div>${items.map(([k, t, c]) => `<a href="#${k}" data-ir='["${k}"]' ${activa === k ? 'aria-current="page"' : ''}>${ico(k === 'config' ? 'config' : k, 17)}${t}${c ? `<span class="cuenta">${c()}</span>` : ''}</a>`).join('')}`).join('')}
    <div class="rail-pie"><label for="sel-rol">Prototipo · ver como</label><select id="sel-rol"><option value="operativo" ${st.rol === 'operativo' ? 'selected' : ''}>Usuario de empresa</option><option value="admin" ${st.rol === 'admin' ? 'selected' : ''}>Administrador global</option></select></div>`;
}
function barraSup() {
  const per = [['mes', 'Mes'], ['trimestre', 'Trimestre'], ['anio', 'Año']].map(([k, t]) => `<button aria-pressed="${st.periodo === k}" data-periodo="${k}">${t}</button>`).join('');
  return `<button class="btn btn-fantasma btn-menu" id="btn-menu" aria-label="Abrir menú">${ico('menu', 20)}</button>

    <div class="espacio"></div>
    ${st.rol === 'operativo' ? `<div class="segmentado" role="group" aria-label="Período">${per}</div>` : ''}
    <button class="btn btn-fantasma campana" data-ir='["agenda"]' aria-label="Alertas">${ico('campana', 18)}<span class="punto">${ALERTAS.length}</span></button>
    <div class="usuario"><b>${st.rol === 'admin' ? 'admin' : 'Betiana Ríos'}</b><span>${st.rol === 'admin' ? 'ADMIN' : 'ADMIN_EMPRESA'}</span></div>`;
}
const VISTAS = { tablero: vTablero, unidades: vUnidades, unidad: vUnidad, viajes: vViajes, agenda: vAgenda, equipos: vEquipos, choferes: vChoferes, gastos: vGastos, cuentas: vCuentas, facturacion: vFacturacion, stock: vStock, config: vConfig, panorama: vPanorama, empresas: vEmpresas, usuarios: vUsuarios };
function render() {
  $('#rail').innerHTML = rail();
  $('#barra-sup').innerHTML = barraSup();
  $('#vista').innerHTML = (VISTAS[st.vista] || vTablero)();
  document.documentElement.setAttribute('data-tema', st.tema);
}
function modal(titulo, cuerpo, ok = 'Guardar') {
  const m = $('#modal');
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-tit"><div class="modal-cabecera"><h2 id="m-tit">${titulo}</h2><button class="btn btn-fantasma btn-chico" data-cerrar aria-label="Cerrar">${ico('cerrar')}</button></div><div class="modal-cuerpo">${cuerpo}</div><div class="modal-pie"><button class="btn btn-fantasma" data-cerrar>Cancelar</button><button class="btn btn-primario" data-ok>${ok}</button></div></div>`;
  m.hidden = false; m.querySelector('input,select')?.focus();
}
function formUnidad(extra) {
  const u = U(st.id);
  return `<div class="formulario"><div class="campo ancho"><label for="fm-u">Unidad</label><select id="fm-u" disabled><option>${esc(u.patente)} — ${esc(u.modelo)}</option></select><span class="ayuda">Viene precargada desde la ficha.</span></div>${extra}</div>`;
}

function abrirRegistro(k) {
    const f = { mant: ['Registrar mantenimiento', '<div class="campo ancho"><label for="fm-c">Concepto</label><input id="fm-c" placeholder="Ej. cambio de aceite y filtros"></div><div class="campo"><label for="fm-p">Periodicidad</label><input id="fm-p" placeholder="Cada 30.000 km"></div><div class="campo"><label for="fm-v">Próximo vencimiento</label><input id="fm-v" type="date"></div>'],
      cub: ['Registrar cubierta', '<div class="campo"><label for="fm-i">Identificador</label><input id="fm-i"></div><div class="campo"><label for="fm-pos">Posición</label><select id="fm-pos"><option>1I</option><option>1D</option><option>2IE</option><option>2II</option><option>2DI</option><option>2DE</option><option>Auxilio</option></select></div>'],
      venc: ['Agregar vencimiento', '<div class="campo ancho"><label for="fm-c">Concepto</label><input id="fm-c" placeholder="Ej. RTO, seguro, RUTA"></div><div class="campo"><label for="fm-v">Fecha de vencimiento</label><input id="fm-v" type="date"></div>'],
      gasto: ['Cargar gasto', '<div class="campo"><label for="fm-r">Rubro</label><select id="fm-r"><option>Combustible</option><option>Consumo general</option></select></div><div class="campo"><label for="fm-m">Monto ($)</label><input id="fm-m" type="number"></div><div class="campo ancho"><label for="fm-c">Concepto</label><input id="fm-c"></div>'] }[k];
    modal(f[0], formUnidad(f[1]));
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-ir],[data-tab],[data-tab-ir],[data-periodo],[data-filtro-u],[data-filtro-v],[data-gtab],[data-ctab],[data-tema],[data-cub],[data-avanzar],[data-accion],[data-cerrar],[data-ok],[data-reg],#btn-menu');
  const menu = $('#menu-reg'); if (menu && !ev.target.closest('#menu-reg')) menu.remove();
  if (!t) return;
  if (t.id === 'btn-menu') { $('.app').classList.toggle('menu-abierto'); return; }
  if (t.dataset.ir) { ev.preventDefault(); const [v, id, tab] = JSON.parse(t.dataset.ir); ir(v, id ?? null, tab); return; }
  if (t.dataset.tab) { st.tab = t.dataset.tab; st.cubSel = null; render(); return; }
  if (t.dataset.tabIr) { ev.preventDefault(); st.tab = t.dataset.tabIr; render(); return; }
  if (t.dataset.periodo) { st.periodo = t.dataset.periodo; render(); return; }
  if (t.dataset.filtroU) { st.filtroUnidades = t.dataset.filtroU; render(); return; }
  if (t.dataset.filtroV) { st.filtroViajes = t.dataset.filtroV; render(); return; }
  if (t.dataset.gtab) { st.gastosTab = t.dataset.gtab; render(); return; }
  if (t.dataset.ctab) { st.tab = t.dataset.ctab; render(); return; }
  if (t.dataset.tema) { st.tema = t.dataset.tema; try { localStorage.setItem('tcv-tema', st.tema); } catch (e) {} render(); toast('Apariencia actualizada.'); return; }
  if (t.dataset.cub) { st.cubSel = t.dataset.cub; render(); return; }
  if (t.dataset.cerrar !== undefined) { $('#modal').hidden = true; return; }
  if (t.dataset.ok !== undefined) { $('#modal').hidden = true; toast('Guardado (prototipo: no se envía nada).'); return; }
  if (t.dataset.avanzar) {
    const v = VIAJES.find(x => x.id === Number(t.dataset.avanzar)), i = ESTADOS.indexOf(v.estado);
    if (v.estado === 'FINALIZADO') { modal(`Facturar viaje #${v.id}`, `<div class="formulario"><div class="campo ancho"><label>Viaje</label><input disabled value="${esc(v.origen)} → ${esc(v.destino)} · ${dinero(v.valor)}"></div><div class="campo ancho"><label for="fm-imp">Cómo imputarlo en la cuenta de ${esc(v.cliente)}</label><select id="fm-imp"><option>Emitir Factura A con CAE</option><option>Imputar sin IVA</option><option>Líquido producto</option></select></div></div>`, 'Facturar'); return; }
    if (v.estado === 'EN DESTINO') { modal(`Finalizar viaje #${v.id}`, `<div class="formulario"><div class="campo ancho"><label>Ruta</label><input disabled value="${esc(v.origen)} → ${esc(v.destino)} · tarifa ${v.tipo}"></div><div class="campo ancho"><label for="fm-res">Toneladas descargadas</label><input id="fm-res" type="number" step="any" value="29.4"><span class="ayuda">Al finalizar se genera la liquidación al chofer.</span></div></div>`, 'Finalizar viaje'); return; }
    v.estado = ESTADOS[i + 1]; render(); toast(`Viaje #${v.id} avanzado a ${v.estado}.`); return;
  }
  if (t.dataset.reg) { $('#menu-reg')?.remove(); abrirRegistro(t.dataset.reg); return; }
  const a = t.dataset.accion;
  if (a === 'registrar') {
    const r = t.getBoundingClientRect(), m = document.createElement('div');
    m.id = 'menu-reg'; m.className = 'menu-flot'; m.style.cssText = `position:fixed;top:${r.bottom + 6}px;left:${Math.max(8, r.right - 230)}px`;
    m.innerHTML = '<button data-reg="mant">Mantenimiento</button><button data-reg="cub">Cubierta</button><button data-reg="venc">Vencimiento</button><button data-reg="gasto">Gasto o carga de combustible</button>';
    document.body.appendChild(m); return;
  }
  const atajo = { 'nuevo-mant': 'mant', 'registrar-mant': 'mant', 'nuevo-venc': 'venc', 'nuevo-gasto': 'gasto', 'rotar': 'cub' }[a];
  if (atajo && st.vista === 'unidad') { abrirRegistro(atajo); return; }
  if (a === 'nuevo-viaje') { modal('Nuevo viaje', `<div class="formulario"><div class="campo"><label for="nv-f">Fecha de origen</label><input id="nv-f" type="datetime-local" value="2026-10-02T07:30"></div><div class="campo"><label for="nv-e">Equipo</label><select id="nv-e">${EQUIPOS.map(e => `<option>${U(e.p).patente} / ${U(e.s).patente} · ${CH(e.chofer).nombre}</option>`).join('')}</select></div><div class="campo"><label for="nv-o">Origen</label><input id="nv-o" value="Villa María"></div><div class="campo"><label for="nv-d">Destino</label><input id="nv-d" placeholder="Ej. Pto. San Martín"></div><div class="campo"><label for="nv-t">Tarifa ($)</label><input id="nv-t" type="number"></div><div class="campo"><label for="nv-tt">Tipo de tarifa</label><select id="nv-tt"><option>POR TONELADA</option><option>POR KM</option><option>UNICA</option></select></div><div class="campo ancho"><label for="nv-p">Pagador</label><select id="nv-p">${CLIENTES.slice(0, 6).map(c => `<option>${esc(c.nombre)}</option>`).join('')}</select></div></div>`, 'Crear viaje'); return; }
  if (a === 'liquidar') { modal('Liquidar sueldos fijos del mes', `<div class="campo"><label for="lq-p">Período</label><input id="lq-p" type="month" value="2026-09"></div><div style="margin-top:12px">${tabla([{ t: '' }, { t: 'Chofer' }, { t: 'Sueldo fijo', num: 1 }], CHOFERES.filter(c => /Fijo|Mixto/.test(c.esquema)).map(c => ({ c: ['<input type="checkbox" checked aria-label="Incluir">', esc(c.nombre), c.esquema.match(/\$ [\d.]+/)[0]] })))}</div>`, 'Liquidar'); return; }
  toast('Acción de ejemplo: en el sistema real abre su formulario.');
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'buscar-unidad') { st.busca = ev.target.value; const pos = ev.target.selectionStart; render(); const el = $('#buscar-unidad'); el.focus(); el.setSelectionRange(pos, pos); }
});
document.addEventListener('change', ev => { if (ev.target.id === 'sel-rol') { st.rol = ev.target.value; ir(st.rol === 'admin' ? 'panorama' : 'tablero'); } });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { $('#modal').hidden = true; $('.app').classList.remove('menu-abierto'); $('#menu-reg')?.remove(); }
  if (ev.key === 'Enter' && ev.target.id === 'buscar-global') {
    const q = ev.target.value.trim().toLowerCase(), u = UNIDADES.find(x => x.patente.toLowerCase().replace(/ /g, '').includes(q.replace(/ /g, '')));
    if (u && q) ir('unidad', u.id); else { st.busca = ev.target.value; ir('unidades'); }
  }
});
try { st.tema = localStorage.getItem('tcv-tema') || 'tcv'; } catch (e) {}
(function () {
  const h = (location.hash || '').slice(1).split('.');
  if (h[0] && VISTAS[h[0]]) { st.vista = h[0]; if (h[1]) st.id = Number(h[1]); if (h[2]) st.tab = h[2]; if (['panorama', 'empresas', 'usuarios'].includes(h[0])) st.rol = 'admin'; }
  if (st.vista === 'unidad' && !U(st.id)) st.vista = 'unidades';
})();
